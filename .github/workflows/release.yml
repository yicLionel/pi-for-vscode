name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json v${PKG_VERSION}"
            exit 1
          fi
          echo "releasing v${PKG_VERSION}"

      - name: Type check
        run: npm run typecheck

      - name: Build extension and webview bundle
        run: npm run compile

      - name: PTY and locator tests
        run: node scripts/smoke.mjs

      - name: Activate the bundled extension headlessly
        run: node scripts/activation-check.cjs

      - name: Render the webview bundle in a browser
        run: node scripts/webview-check.mjs

      - name: Package the VSIX
        run: npm run package

      - name: Checksums
        run: |
          sha256sum ./*.vsix > SHA256SUMS.txt
          ls -l ./*.vsix
          cat SHA256SUMS.txt

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" ./*.vsix ./SHA256SUMS.txt --clobber
          echo "::notice::https://github.com/${{ github.repository }}/releases/tag/$TAG"
