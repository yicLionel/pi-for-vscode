name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build extension and webview bundle
        run: npm run compile

      - name: PTY and locator tests
        run: node scripts/smoke.mjs

      - name: Activate the bundled extension headlessly
        run: node scripts/activation-check.cjs

      - name: Render the webview bundle in a browser
        if: runner.os != 'Windows'
        run: node scripts/webview-check.mjs

      - name: Package the extension
        if: runner.os == 'Linux'
        run: npm run package

      - name: Upload the VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: pi-for-vscode-vsix
          path: '*.vsix'
          if-no-files-found: error
